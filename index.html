<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moto Map</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MotoMap" />
  <meta name="description" content="Browse your motorcycle routes and points of interest on an interactive map." />

  <!-- Open Graph / Social link previews -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Moto Map" />
  <meta property="og:title"       content="Moto Map" />
  <meta property="og:description" content="Browse my motorcycle routes and points of interest on an interactive map." />
  <meta property="og:image"       content="/assets/og/default.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url"         content="/" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Moto Map" />
  <meta name="twitter:description" content="Browse my motorcycle routes and points of interest on an interactive map." />
  <meta name="twitter:image"       content="/assets/og/default.png" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <app-sidebar></app-sidebar>

  <script type="module" src="main.js"></script>
</body>
</html>
